version: "3.9"
services:
  layer2:
    build: .
    command: uvicorn layer2.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env

  layer3-api:
    build: .
    command: uvicorn layer3.stats_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      - layer2

  layer1-ssh:
    build: .
    command: python layer1/ssh_server.py
    ports:
      - "2222:2222"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      - layer2

  layer1-http:
    build: .
    command: python layer1/http_server.py
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      - layer2
